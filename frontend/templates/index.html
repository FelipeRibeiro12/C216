<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página Inicial</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>
  <body>
    <header>
      <h1>Bem vindo</h1>
      <p style="color: white; font-size: 0.9em; margin-top: -10px"></p>
      <nav>
        <a href="/">Home</a>
        <a href="/logout">Sair</a>
      </nav>
    </header>
    <section>
      <h2>Início</h2>
      <p>Olá!</p>

      <div
        style="
          background-color: #ecf0f1;
          padding: 20px;
          border-radius: 8px;
          margin-top: 25px;
          border-left: 5px solid #2980b9;
        "
      >
        <h3 style="margin-top: 0; color: #2c3e50">Seus Dados Cadastrados</h3>
        <p style="margin: 8px 0"><strong>Nome:</strong> {{ nome }}</p>
        <p style="margin: 8px 0"><strong>Matrícula:</strong> {{ matricula }}</p>
        <p style="margin: 8px 0">
          <strong>E-mail Institucional:</strong> {{ email }}
        </p>
      </div>
    </section>
  </body>
</html>
