<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - Sistema</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>
  <body>
    <header>
      <h1>Acesso ao Sistema</h1>
    </header>
    <section>
      <h2>Faça seu Cadastro</h2>
      <p>Insira seu nome e curso para criar seu e-mail de acesso.</p>

      {% if error %}
      <p style="color: red; font-weight: bold">{{ error }}</p>
      {% endif %}

      <form method="POST" action="/register" class="login-form">
        <div class="form-group">
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Seu Nome Completo (ex: Felipe Ribeiro)"
            required
          />
        </div>
        <div class="form-group">
          <select
            id="curso"
            name="curso"
            required
            style="
              width: 100%;
              padding: 10px;
              border: 1px solid #ccc;
              border-radius: 4px;
              box-sizing: border-box;
            "
          >
            <option value="" disabled selected>Selecione seu Curso</option>
            <option value="ges">Engenharia de Software (GES)</option>
            <option value="gec">Engenharia de Computação (GEC)</option>
            <option value="geb">Engenharia Biomédica (GEB)</option>
            <option value="gea">Engenharia de Automação (GEA)</option>
            <option value="get">Engenharia de Telecomunicações (GET)</option>
            <option value="gep">Engenharia de Produção (GEP)</option>
          </select>
        </div>
        <button type="submit" class="btn">Cadastrar e Entrar</button>
        <br /><br />
        <a
          href="/login"
          class="btn"
          style="
            background-color: #7f8c8d;
            text-decoration: none;
            display: block;
            text-align: center;
            box-sizing: border-box;
          "
          >Voltar para o Login</a
        >
      </form>
    </section>
  </body>
</html>
